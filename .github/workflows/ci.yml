name: Sacred Compilation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify C++ compiler
        run: g++ --version
      - name: Python and native differential tests
        run: python3 -m unittest discover -s tests -v
      - name: Independent three-generation self-hosting bootstrap
        run: bash scripts/bootstrap.sh
